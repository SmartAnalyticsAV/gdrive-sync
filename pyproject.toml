[project]
name = "gdrive-sync"
version = "0.1.0"
description = "One-way mirror of local Mac folders to Google Drive"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SmartAnalyticsAV" }]
dependencies = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "typer>=0.12",
]

[project.scripts]
gdrive-sync = "gdrive_sync.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdrive_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
